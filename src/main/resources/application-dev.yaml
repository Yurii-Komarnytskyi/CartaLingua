vaadin:
  launch-browser: true

spring:
  application:
    name: CartaLingua
  datasource:
    url: url
    username: username
    password: secure_password_here
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: none
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect

    liquibase:
      enabled: true
      change-log: classpath:db/changelog/db.changelog-master.yaml

  security:
    user:
      name: user
      password: pass